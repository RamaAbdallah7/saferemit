<title>SafeRemit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Cairo:wght@400;500;600;700&display=swap">

<style>
  :root{
    --ground:#EEF1EC;
    --surface:#FFFFFF;
    --surface-2:#F6F7F3;
    --ink:#18211C;
    --ink-2:#4B554E;
    --ink-3:#646D66;
    --line:#E0E3DC;
    --line-2:#CFD3C9;
    --shield:#0C6B54;
    --shield-2:#0A5A46;
    --shield-soft:#DEEEE8;
    --shield-ink:#06422F;
    --gold:#9A6A22;
    --gold-soft:#F1E6CF;
    --high:#AE3628;
    --high-soft:#F6DFDA;
    --mid:#875C0C;
    --mid-soft:#F3E7CB;
    --ok:#0C6B54;
    --ok-soft:#DEEEE8;
    --shadow:0 1px 2px rgba(24,33,28,.05), 0 10px 28px -14px rgba(24,33,28,.16);
    --shadow-lift:0 2px 6px rgba(24,33,28,.07), 0 24px 50px -20px rgba(24,33,28,.24);
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --ar:"Cairo", "IBM Plex Sans", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  ::selection{background:var(--shield);color:#fff}
  button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;background:none;border:none}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--shield);outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

  /* Arabic narrative text */
  .ar{font-family:var(--ar)}
  h1.disp[dir="rtl"],h2.disp[dir="rtl"]{text-align:right;line-height:1.4;letter-spacing:0;font-weight:600}
  .lede[dir="rtl"]{text-align:right;margin-inline-start:auto;line-height:1.85}
  .kicker-ar{direction:rtl;text-align:right;line-height:1.9}
  .q[dir="rtl"]{direction:rtl;line-height:1.5}
  .cta-row[dir="rtl"]{flex-direction:row-reverse}

  .app{display:flex;flex-direction:column;min-height:100vh}
  .progress{height:2px;background:var(--line);position:sticky;top:0;z-index:60}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--shield),var(--shield-2));transition:width .45s cubic-bezier(.22,.61,.36,1)}

  header.bar{display:flex;align-items:center;gap:12px;padding:11px clamp(16px,4vw,34px);
    border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 90%,transparent);
    backdrop-filter:blur(10px);position:sticky;top:2px;z-index:50;transition:transform .32s ease}
  header.bar.hide{transform:translateY(-115%)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;font-size:15px}
  .bar .spacer{flex:1}
  .txtbtn{font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:var(--ink-2);padding:6px 10px;border-radius:999px;transition:color .15s}
  .txtbtn:hover{color:var(--shield)}
  .langtog{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;transition:border-color .15s}
  .langtog:hover{border-color:var(--shield)} .langtog b{color:var(--ink)}

  main{flex:1;display:flex;flex-direction:column}
  #stage{flex:1;display:flex;flex-direction:column}
  .scene{flex:1;display:flex;flex-direction:column;animation:sceneIn .42s cubic-bezier(.22,.61,.36,1) both}
  @keyframes sceneIn{from{opacity:0;transform:translateX(var(--dir,18px))}to{opacity:1;transform:none}}

  .wrap{width:100%;max-width:1060px;margin:0 auto;padding:clamp(22px,4vw,46px) clamp(16px,4vw,34px);flex:1;display:flex;flex-direction:column}
  .wrap.narrow{max-width:720px}
  .wrap.wide{max-width:1180px}
  .wrap.center{justify-content:center}

  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--shield);font-weight:500}
  h1.disp{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4.6vw,46px);line-height:1.11;letter-spacing:-.015em;text-wrap:balance;margin:.35em 0 .42em}
  h2.disp{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3.1vw,31px);line-height:1.16;letter-spacing:-.01em;text-wrap:balance;margin:.12em 0 .38em}
  .lede{font-size:clamp(14px,1.55vw,16.5px);color:var(--ink-2);max-width:60ch;line-height:1.62}
  .kicker-ar{font-family:var(--ar);font-size:16px;color:var(--gold);margin-top:9px;font-weight:600}
  .fine{font-size:12.5px;color:var(--ink-3);line-height:1.5}
  .fine.mono{font-family:var(--mono);letter-spacing:.02em}

  .cta{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:11px;background:var(--shield);color:#fff;
    font-weight:500;font-size:14px;border:1px solid transparent;transition:transform .12s,filter .12s,box-shadow .12s;box-shadow:0 1px 2px rgba(12,107,84,.25)}
  .cta:hover{filter:brightness(1.07);box-shadow:0 6px 18px -6px rgba(12,107,84,.45)}
  .cta:active{transform:translateY(1px)}
  .cta.ghost{background:transparent;color:var(--ink);border-color:var(--line-2);box-shadow:none}
  .cta.ghost:hover{border-color:var(--shield);color:var(--shield);filter:none;box-shadow:none}
  .cta.warn{background:var(--mid);box-shadow:none} .cta.danger{background:var(--high);box-shadow:none}
  .cta.sm{padding:9px 14px;font-size:13px}
  .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

  /* ---------- device ---------- */
  .duo{display:flex;gap:clamp(22px,4vw,52px);align-items:center;flex-wrap:wrap;justify-content:center;flex:1}
  .aside{max-width:322px}
  .phone{width:348px;flex:0 0 348px;background:#122420;border-radius:44px;padding:10px;box-shadow:var(--shadow-lift);position:relative}
  .phone::before{content:"";position:absolute;top:19px;left:50%;transform:translateX(-50%);width:90px;height:18px;background:#122420;border-radius:0 0 13px 13px;z-index:3}
  .screen{background:var(--surface);border-radius:35px;overflow:hidden;height:636px;display:flex;flex-direction:column}
  .status{display:flex;justify-content:space-between;padding:13px 22px 5px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .pbody{flex:1;overflow-y:auto;padding:8px 20px 18px}
  .pbody::-webkit-scrollbar{width:0}
  .pnav{padding:11px 20px 18px;border-top:1px solid var(--line);display:flex;gap:8px}

  .apphead{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 15px}
  .apphead .hi{font-family:var(--serif);font-size:20px}
  .av{width:34px;height:34px;border-radius:999px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:600;font-size:13px}
  .balcard{background:linear-gradient(150deg,var(--shield),var(--shield-2));color:#fff;border-radius:18px;padding:17px;margin-bottom:17px}
  .balcard .l{font-size:11px;opacity:.85;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
  .balcard .a{font-family:var(--serif);font-size:29px;margin-top:3px}
  .seclab{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:5px 0 8px}
  .txn{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
  .txn:last-child{border-bottom:0}
  .txn .ic{width:30px;height:30px;border-radius:999px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-size:12px}
  .txn .w{font-weight:500;font-size:13px} .txn .d{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .txn .v{margin-inline-start:auto;font-family:var(--mono);font-size:12.5px;font-weight:500}

  .fld{margin-bottom:11px}
  .fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
  .fld .box{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:500;background:var(--surface-2);display:flex;align-items:center;gap:8px}
  .fld .box.flag{border-color:var(--mid);color:var(--mid);background:var(--mid-soft)}
  .amtbox{border:1px solid var(--line-2);border-radius:12px;padding:14px;background:var(--surface-2);text-align:center}
  .amtbox .n{font-family:var(--serif);font-size:31px} .amtbox .c{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:2px}

  .phish{border:1px solid var(--high);border-radius:14px;overflow:hidden;margin-top:4px}
  .phish .url{background:var(--high-soft);color:var(--high);font-family:var(--mono);font-size:11px;padding:8px 12px;word-break:break-all}
  .phish .form{padding:15px}
  .phish .inp{border:1px solid var(--line-2);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-bottom:8px;background:var(--surface-2)}
  .phish .fk{background:#1b4dd8;color:#fff;text-align:center;border-radius:8px;padding:10px;font-size:13px;font-weight:500}

  .alerthead{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px 6px 10px;gap:8px}
  .alerthead .sw{width:48px;height:48px;border-radius:999px;background:var(--mid-soft);color:var(--mid);display:grid;place-items:center}
  .alerthead .t{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mid);font-weight:500}
  .alertcard{border:1px solid var(--line-2);border-radius:14px;padding:15px;background:var(--surface-2);margin-top:4px}
  .alertcard .big{font-family:var(--serif);font-size:25px;text-align:center}
  .alertcard .sub{text-align:center;font-size:12px;color:var(--ink-2)}
  .noticed{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .q{font-family:var(--serif);font-size:18px;text-align:center;margin:16px 6px 2px;line-height:1.3;text-wrap:balance}
  .qar{font-family:var(--ar);text-align:center;color:var(--ink-2);font-size:13px;margin-bottom:10px;direction:rtl}

  .paused{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:9px;padding:26px;
    background:linear-gradient(160deg,var(--shield),var(--shield-2));color:#fff}
  .paused .tag{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.88}
  .paused .a{font-family:var(--serif);font-size:35px;line-height:1.06}
  .paused .m{font-size:12.5px;opacity:.92;max-width:24ch}

  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:11.5px;font-family:var(--mono)}
  .pill b{color:var(--high)}

  /* ---------- pipeline ---------- */
  .piperow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(16px,4vw,38px);align-items:start;flex:1}
  .pipe{display:flex;flex-direction:column}
  .pstage{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 14px;display:flex;flex-direction:column;gap:1px;box-shadow:var(--shadow);
    opacity:.38;transform:translateY(4px);transition:opacity .45s,transform .45s,border-color .45s}
  .pstage.on{opacity:1;transform:none}
  .pstage.key{border-color:var(--shield)}
  .pstage .sl{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase}
  .pstage .sd{font-size:11.5px;color:var(--ink-2)}
  .pconn{width:1px;height:14px;background:var(--line-2);margin-inline-start:22px;opacity:.38;transition:opacity .45s,background .45s}
  .pconn.on{opacity:1;background:var(--shield)}
  .signals{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .signals h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--line);font-weight:500}
  .sig{display:flex;align-items:flex-start;gap:11px;padding:10px 16px;border-bottom:1px solid var(--line);opacity:0;transform:translateX(-6px);transition:opacity .35s,transform .35s}
  .sig:last-child{border-bottom:0} .sig.on{opacity:1;transform:none}
  .sig .mk{width:18px;height:18px;border-radius:999px;display:grid;place-items:center;flex:0 0 18px;margin-top:1px;font-size:10px;font-weight:700}
  .sig .mk.ok{background:var(--ok-soft);color:var(--ok)}
  .sig .mk.high{background:var(--high-soft);color:var(--high)}
  .sig .mk.mid{background:var(--mid-soft);color:var(--mid)}
  .sig .api{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  .sig .tx{font-size:12.5px;font-weight:500;line-height:1.3}
  .sig .sr{font-size:11px;color:var(--ink-2)}
  .scorebar{display:flex;align-items:center;gap:13px;padding:12px 16px;background:var(--surface-2)}
  .scorebar .n{font-family:var(--mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--high)}
  .scorebar .l{font-size:11px;color:var(--ink-2)}
  .scorebar .vd{margin-inline-start:auto;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--high);border:1px solid var(--high);border-radius:999px;padding:3px 10px;transition:opacity .4s}

  /* ---------- gemini ---------- */
  .cols{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:start;flex:1}
  .iocard{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .iocard h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--line);font-weight:500}
  .ior{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
  .ior:last-child{border-bottom:0}
  .ior .k{color:var(--ink-2)} .ior .v{font-family:var(--mono);font-size:12px;text-align:end}
  .ior .v.flag{color:var(--high)} .ior .v.warn{color:var(--mid)}
  .gout{border:1px solid var(--shield);border-radius:14px;background:var(--shield-soft);padding:17px}
  .gout .gl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--shield-ink);font-weight:500}
  .gout p{margin-top:8px;font-size:14px;line-height:1.55}
  .gmeta{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
  .recband{margin-top:12px;background:var(--surface);border:1px solid var(--shield);border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:10px}
  .recband .rl{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .recband .rv{font-family:var(--mono);font-weight:500;letter-spacing:.04em;color:var(--shield)}
  .disc{margin-top:11px;font-size:11.5px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start}

  /* ---------- gauge ---------- */
  .gaugewrap{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .gauge{position:relative;width:206px;flex:0 0 206px}
  .gauge svg{width:100%;height:auto;display:block}
  .gauge .arc-fill{transition:stroke-dasharray .55s cubic-bezier(.22,.61,.36,1),stroke .3s}
  .gauge .gn{position:absolute;left:0;right:0;bottom:15px;text-align:center;font-family:var(--mono);font-size:37px;font-weight:500;font-variant-numeric:tabular-nums;transition:color .3s}
  .gauge .go{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
  .whycard{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);flex:1;min-width:260px;overflow:hidden}
  .whycard h4{font-family:var(--serif);font-size:16px;padding:13px 18px 5px}
  .whyrow{display:flex;align-items:center;gap:12px;padding:8px 18px;border-top:1px solid var(--line)}
  .whyrow .t{font-size:12px}
  .whyrow .b{width:60px;height:5px;border-radius:999px;background:var(--line-2);overflow:hidden;flex:0 0 60px}
  .whyrow .b i{display:block;height:100%;background:var(--high)}
  .whyrow .w{margin-inline-start:auto;font-family:var(--mono);font-size:11.5px;color:var(--high);font-weight:500}
  .bands{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:18px}
  .band{background:var(--surface);padding:12px 15px}
  .band .bn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--shield);font-weight:500}
  .band .bd{font-size:11.5px;color:var(--ink-2);margin-top:3px}

  /* ---------- dashboard ---------- */
  .dash{border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-lift);overflow:hidden}
  .dtop{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .dtop .b{font-weight:600} .dtop .s{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
  .dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)}
  .dlist{border-inline-end:1px solid var(--line)}
  .dlh{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:11px 16px}
  .drow{display:flex;flex-direction:column;gap:3px;padding:10px 16px;border-top:1px solid var(--line);position:relative}
  .drow .ln{display:flex;align-items:center;gap:8px}
  .drow .who{font-weight:500;font-size:12.5px} .drow .amt{margin-inline-start:auto;font-family:var(--mono);font-size:11.5px}
  .drow .st{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .drow[data-sel="true"]{background:var(--shield-soft)}
  .drow[data-sel="true"]::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--shield)}
  .st.review{color:var(--mid)} .st.ok{color:var(--ok)} .st.prot{color:var(--high)}
  .ddetail{padding:17px}
  .ddh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ddh .amt{font-family:var(--serif);font-size:24px}
  .ddh .bd{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);border:1px solid var(--mid);border-radius:999px;padding:3px 9px}
  .ddc{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:14px}
  @media (max-width:560px){.ddc{grid-template-columns:1fr}}
  .ddb h5{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border-bottom:0} .kv .vv{font-family:var(--mono);font-size:11.5px}
  .kv .vv.yes{color:var(--high)} .kv .vv.low{color:var(--mid)} .kv .vv.no{color:var(--ok)}
  .ainote{margin-top:12px;background:var(--shield-soft);border:1px solid var(--shield);border-radius:10px;padding:10px 13px;font-size:12px}
  .ainote b{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--shield-ink);display:block;margin-bottom:3px}
  .dacts{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
  .opres{margin-top:12px;font-size:12px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2)}
  .opres.good{border-color:var(--shield);background:var(--shield-soft)}
  .opres.bad{border-color:var(--high);background:var(--high-soft)}

  /* ---------- compare ---------- */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:700px){.compare{grid-template-columns:1fr}}
  .flow{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:17px;box-shadow:var(--shadow)}
  .flow.bad{border-color:var(--high-soft)} .flow.good{border-color:var(--shield)}

<script>
(function(){

      +dot+mid
      +'<text x="24" y="'+(h-8)+'" font-family="var(--mono)" font-size="9" fill="'+txt+'">DUBAI · UAE</text>'
      +'<text x="'+(w-24)+'" y="16" font-family="var(--mono)" font-size="9" fill="'+txt+'" text-anchor="end">İSTANBUL · TR</text></svg>';
  }
  function phone(inner,o){ o=o||{}; return '<div class="phone"><div class="screen"><div class="status"><span>'+(o.carrier||"Etisalat")+'</span><span>'+(o.time||"21:04")+'</span></div>'+inner+'</div></div>'; }

  var ROLES=[
    ["CAMARA APIs","A standard interface for network capabilities. The same call works across operators."],
    ["Nokia Network as Code","The access + orchestration layer that exposes operator network APIs to an application."],
    ["Gemini","Reads the combined signals and transaction context, explains the risk, recommends an action."],

  function rolesStrip(){ return '<div class="roles">'+ROLES.map(function(r){return '<div class="role"><div class="rn">'+esc(r[0])+'</div><div class="rd">'+esc(r[1])+'</div></div>';}).join("")+'</div>'; }

  /* ============ risk model ============ */
  var W = { unverified:34, simswap:40, newdevice:14, roaming:8, loc_mismatch:16, loc_mismatch_roaming:8, loc_partial:9, newrecipient:8, amt_elevated:8, amt_high:10, onboarding:6 };

    travel:   { label:"Customer is travelling",  cfg:{nv:"verified",sim:"none",dev:"known",net:"roaming",loc:"mismatch",rec:"known",amt:"normal",act:"transfer"} },
    newphone: { label:"New phone, same person",  cfg:{nv:"verified",sim:"none",dev:"new",net:"home",loc:"match",rec:"known",amt:"normal",act:"login"} },
    takeover: { label:"SIM-swap takeover (Ahmed)",cfg:{nv:"verified",sim:"recent",dev:"new",net:"home",loc:"mismatch",rec:"new",amt:"high",act:"transfer"} },

  };
  function computeRisk(c){
    var parts=[], s=0;
    function add(p,label){ s+=p; parts.push([label,p]); }

    if(c.sim==="recent") add(W.simswap,"SIM changed within 72h");
    if(c.dev==="new") add(W.newdevice,"Device never seen on this account");
    if(c.net==="roaming") add(W.roaming,"Device is roaming");
    if(c.loc==="mismatch") add(c.net==="roaming"?W.loc_mismatch_roaming:W.loc_mismatch, c.net==="roaming" ? "Location mismatch — scored as travel (roaming)" : "Claimed location doesn’t match the network");
    else if(c.loc==="partial") add(W.loc_partial,"Claimed location partially matches");
    if(c.rec==="new") add(W.newrecipient,"New recipient — never paid before");
    if(c.amt==="elevated") add(W.amt_elevated,"Amount 2–4× the usual");

    { label:"Opening", render:function(){

        +'<p class="lede">'+T("Protecting the money between families.","نحمي المال بين العائلات.")+'</p>'
        +(state.lang==="ar" ? '<p class="kicker-ar">نحمي المال بين العائلات.</p>' : '')
        +'<p class="fine mono" style="margin-top:14px">CAMARA · Nokia Network as Code · Gemini AI</p>'
        +'<div class="cta-row"><button class="cta ghost" data-go="0">'+T("Replay the story","إعادة القصة")+'</button><button class="cta" data-go="13">'+T("Try any combination","جرّب أي تركيبة")+' &rarr;</button></div>'
        +'</div>';
    }},

    /* ---------- 13 · SANDBOX ---------- */
    { label:"Try any combination", render:function(){
      if(!state.sb) state.sb = Object.assign({}, DEFAULT_SB);
      var groups=[
        ["nv","Number Verification","CAMARA · Number Verification",[["verified","Verified",0],["unverified","Not verified",1]]],
        ["sim","SIM Swap","CAMARA · SIM Swap",[["none","No recent change",0],["recent","Changed <72h",1]]],
        ["dev","Device","CAMARA · Device Swap",[["known","Known device",0],["new","New device","mid"]]],
        ["net","Network","CAMARA · Device Status",[["home","Home network",0],["roaming","Roaming","mid"]]],
        ["loc","Claimed location","CAMARA · Location Verification",[["match","Matches",0],["partial","Partial","mid"],["mismatch","No match",1]]],
        ["rec","Recipient","transaction",[["known","Known",0],["new","New","mid"]]],
        ["amt","Amount vs. history","transaction",[["normal","Normal",0],["elevated","2–4×","mid"],["high","Over 4×","mid"]]],
        ["act","Action","transaction",[["login","Login",0],["transfer","Transfer",0],["onboarding","Onboarding","mid"]]]
      ];
      var presets='<div class="presets">'+Object.keys(PRESETS).map(function(k){
        return '<button class="preset" data-preset="'+k+'" aria-pressed="false">'+esc(PRESETS[k].label)+'</button>';
      }).join("")+'</div>';
      var ctrls='';
      groups.forEach(function(g){
        ctrls+='<div class="ctrl"><div class="cl"><span class="name">'+esc(g[1])+'</span><span class="api-t">'+esc(g[2])+'</span></div><div class="seg2" data-key="'+g[0]+'">';
        g[3].forEach(function(opt){
          var on=state.sb[g[0]]===opt[0];
          ctrls+='<button data-v="'+opt[0]+'" data-risk="'+(opt[2]||0)+'" aria-pressed="'+on+'">'+esc(opt[1])+'</button>';
        });
        ctrls+='</div></div>';
      });
      var wtRows=[
        ["SIM changed within 72h","+40"],["Number not verified on the device","+34"],
        ["Location doesn’t match — home network","+16"],["&nbsp;&nbsp;↳ but the device is roaming — scored as travel","+8"],
        ["Location partially matches","+9"],["Device never seen on this account","+14"],
        ["Amount over 4× the usual","+10"],["Amount 2–4× the usual","+8"],
        ["New recipient","+8"],["Device is roaming","+8"],["Account onboarding — higher scrutiny","+6"]
      ];
      var wt='<details class="foldtable"><summary>The scoring table · and the CAMARA calls behind it</summary>'
        +'<table class="wt"><tbody>'+wtRows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>';}).join("")+'</tbody></table>'
        +'<div style="padding:12px 15px;border-top:1px solid var(--line)"><p class="fine">Score caps at 100. Bands: <b style="color:var(--ok)">0–30 allow</b>, <b style="color:var(--mid)">31–70 step-up</b>, <b style="color:var(--high)">71–100 pause</b>. The largest single signal is +40 — a pause always needs at least two.</p>'
        +'<div class="evgrid" style="margin-top:10px">'
        +['Number Verification|Confirm the number is on the requesting device',
          'SIM Swap|Was the SIM re-issued within a window?',
          'Device Swap|Is a new device being used for this account?',
          'Location Verification|Is the network location consistent with the claim?'].map(function(x){var p=x.split("|");
          return '<div class="ev"><div class="h"><span class="api">CAMARA · '+p[0]+'</span><span class="tag">Demo / sandbox</span></div><div class="body"><span class="rq">request &nbsp;</span>'+p[1]+'<br><span class="rq">response</span> reflects the toggle above</div></div>';
        }).join("")+'</div></div></details>';
      return '<div class="wrap wide"><p class="eyebrow">How it works · try it yourself</p>'
        +'<h2 class="disp">'+T("Every combination — not one story.","كل التركيبات — لا سيناريو واحد.")+'</h2>'
        +'<p class="lede" style="font-size:13.5px">'+T("Toggle the signals a real transaction would carry. The risk engine re-scores live — the same logic that ran for Ahmed. Location on a roaming device is scored as travel, so a VPN or a trip abroad never blocks a transfer on its own.","بدّل الإشارات وشاهد النتيجة تتغيّر مباشرة — بالمنطق نفسه الذي جرى مع أحمد.")+'</p>'
        +'<div class="sandbox">'
        +'<div class="sb-controls">'+presets+ctrls+'</div>'
        +'<div class="sb-result" id="sbres"></div>'
        +'</div>'+wt+'</div>';
    }, mount:function(){
      renderSbResult();
      document.querySelectorAll("[data-preset]").forEach(function(b){
        b.addEventListener("click",function(){
          state.sb=Object.assign({}, PRESETS[b.getAttribute("data-preset")].cfg);
          document.querySelectorAll("[data-preset]").forEach(function(x){ x.setAttribute("aria-pressed", x===b?"true":"false"); });
          syncSbControls(); renderSbResult();
        });
      });
      document.querySelectorAll(".seg2").forEach(function(seg){
        var key=seg.getAttribute("data-key");
        seg.querySelectorAll("button").forEach(function(btn){
          btn.addEventListener("click",function(){
            state.sb[key]=btn.getAttribute("data-v");
            seg.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed", x===btn?"true":"false"); });
            document.querySelectorAll("[data-preset]").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
            renderSbResult();
          });
        });
      });
    }},

    /* ---------- 14 · IS THIS REAL ---------- */
    { label:"Is any of this real?", render:function(){
      var verify=[
        ['Open <code>saferemit.onrender.com/api/health</code> — it returns <b>camara_mode: "live"</b> and the real Nokia gateway URL <code>network-as-code.p-eu.apihub.nokia.io</code>.'],
        ['Run a decision on that live prototype. The response <b>trace</b> tags each signal <code>source: "live"</code>, and on a failure it carries Nokia’s <b>actual HTTP error</b> — you can’t fabricate a real 401 from Nokia’s auth.'],
        ['Nokia’s own <b>Network-as-Code analytics</b> dashboard shows the call count (259 and rising). That’s Nokia counting the calls, not us.'],
        ['The source is <b>public on GitHub</b> — <code>github.com/RamaAbdallah7/saferemit</code>. <code>backend/camara_apis/*.py</code> is a plain <code>requests.post()</code> to the gateway, no hardcoded returns to read.'],
        ['<b>Google AI Studio → Usage</b> shows real Gemini request volume for the “saferemit” project.']
      ];
      return '<div class="wrap wide"><p class="eyebrow">How it works · the honest answer</p>'
        +'<h2 class="disp">Is any of this real?</h2>'
        +'<p class="lede" style="font-size:13.5px">Straight answer: this walkthrough is a <b>presentation layer</b> — the responses are simulated so it runs anywhere, in three minutes. The <b>working prototype</b> lives on the same site and makes the calls for real.</p>'
        +'<div class="grid2" style="margin-top:16px">'
        +'<div class="card sim"><h4 class="ch">This walkthrough — simulated</h4><p style="font-size:12.5px;color:var(--ink-2)">Client-side only. Every CAMARA and Gemini response is generated from the scenario or your sandbox toggles, and labelled “sandbox” throughout. Built for the stage, not for proof.</p></div>'
        +'<div class="card"><h4 class="ch">The working prototype — live</h4><p style="font-size:12.5px;color:var(--ink-2)">FastAPI + LangGraph at <b>saferemit.onrender.com/app</b>. SIM Swap, Device Status and Location Verification run live against Nokia’s Network-as-Code simulator. Gemini runs live via Google AI Studio. Number Verification is a CAMARA <b>3-legged flow</b> — it is initiated from the customer’s own device, so a server can’t call it alone; the app triggers it client-side in production, and the prototype uses a cached result for that one signal by design.</p></div>'
        +'</div>'
        +'<div class="cta-row" style="margin-top:16px"><a class="cta" href="https://saferemit.onrender.com/app/" target="_blank" rel="noopener">Open the live prototype &rarr;</a>'
        +'<a class="cta ghost" href="https://saferemit.onrender.com/api/health" target="_blank" rel="noopener">See /api/health &rarr;</a>'
        +'<a class="cta ghost" href="https://github.com/RamaAbdallah7/saferemit" target="_blank" rel="noopener">Source on GitHub &rarr;</a></div>'
        +'<h5 class="seclab" style="margin-top:18px">Verify it yourself — five ways</h5>'
        +'<div class="verify">'+verify.map(function(v){return '<div class="vrow"><span>'+v[0]+'</span></div>';}).join("")+'</div>'
        +'<p class="fine mono" style="margin-top:12px">The story sells it. The live endpoint proves it.</p>'
        +'</div>';
    }},

    /* ---------- 15 · ARCHITECTURE ---------- */
    { label:"How it fits together", render:function(){
      var phases=[
        ["Request",[["Ahmed’s remittance app","he taps send","gold"],["Remittance provider","runs the payment, owns the customer","gold"],["SafeRemit API","one call — “score this transaction”","hl"]]],
        ["Signals",[["Nokia Network as Code","exposes + orchestrates operator APIs",""],["CAMARA APIs","the standard interface for network capabilities","hl"],["Participating operator","answers only the specific question","gold"]]],
        ["Decision",[["SafeRemit Risk Engine","combines everything → risk score","hl"],["Gemini","explains, recommends allow / step-up / pause","hl"],["Bank policy engine","the provider decides & keeps the trail","gold"]]]
      ];
      var line='<div class="archline">'+phases.map(function(p){
        return '<div class="phase"><div class="ph">'+esc(p[0])+'</div>'+p[1].map(function(n){
          return '<div class="node '+(n[2]||"")+'"><div class="nt">'+esc(n[0])+'</div><div class="nd">'+esc(n[1])+'</div></div>';
        }).join("")+'</div>';
      }).join("")+'</div>';
      return '<div class="wrap wide"><p class="eyebrow">How it works · the architecture</p>'
        +'<h2 class="disp">Three moves: request, signals, decision.</h2>'
        +'<p class="lede" style="font-size:13.5px">A provider adds SafeRemit as a single API call at login, onboarding and transfer. Every box below already exists as a standard or a product — SafeRemit is the risk logic that ties them together, and the provider always makes the final call.</p>'
        +line+rolesStrip()+'</div>';
    }},

    /* ---------- 16 · DEPLOY ---------- */
    { label:"Ready for a pilot", render:function(){
      var priv=[
        ["SafeRemit never receives call or message content.","APIs return capability answers — “SIM changed: yes/no” — not transcripts, contacts, or history."],
        ["Each check returns only what it needs.","A SIM Swap check answers one question, not the subscriber’s wider record."],
        ["Trusted contacts see the minimum.","Mariam sees an amount, that it’s unusual, and one question. No account or network data."],
        ["The provider stays in control.","SafeRemit and Gemini recommend. The bank’s policy engine decides and keeps the audit trail."]
      ];
      var pv='<div class="card"><div class="seclab">Private by design</div>'+priv.map(function(p){
        return '<div class="privitem"><span class="ic"><svg width="18" height="20" viewBox="0 0 22 24"><path d="M11 1 20 4.5V12c0 6-3.8 9.6-9 11-5.2-1.4-9-5-9-11V4.5L11 1Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span><span><span class="t">'+esc(p[0])+'</span><span class="d">'+esc(p[1])+'</span></span></div>';
      }).join("")+'</div>';
      var tc='<div class="card"><div class="seclab">Trust Circle · configured in advance</div>'
        +'<div class="tcm"><span class="a">M</span><span><b>Mariam</b> ♥<br><span class="r">Mother · İstanbul</span></span></div>'
        +'<div class="tcm"><span class="a">Y</span><span><b>Yusuf</b><br><span class="r">Brother · Ankara</span></span></div>'
        +'<div class="rule"><span class="w">When · transfer above AED 5,000</span><br>Ask for additional verification.</div>'
        +'<div class="rule"><span class="w">When · risk is High</span><br>Notify a trusted contact and pause until they respond.</div></div>';
      return '<div class="wrap wide"><p class="eyebrow">How it works · safe to deploy</p>'
        +'<h2 class="disp">Built so a bank and an operator could actually pilot it.</h2>'
        +'<div class="split" style="margin-top:16px">'+pv+tc+'</div>'
        +'<div style="margin-top:18px"><span class="demo-badge">Demo data</span></div>'
        +'<div class="stats">'
        +'<div class="stat"><div class="n" id="s1">0</div><div class="l">Transfers analysed</div></div>'
        +'<div class="stat"><div class="n" id="s2">0</div><div class="l">High-risk transfers</div></div>'
        +'<div class="stat acc"><div class="n" id="s3">0</div><div class="l">Protected</div></div>'
        +'<div class="stat acc"><div class="n" id="s4">AED 0</div><div class="l">Amount protected</div></div></div>'
        +'<div class="cta-row"><button class="cta ghost" data-go="0">Replay the story</button><button class="cta" data-go="13">Back to the sandbox</button></div>'
        +'</div>';
    }, mount:function(){ countUp("s1",1284,""); countUp("s2",37,""); countUp("s3",12,""); countUp("s4",84500,"AED "); }}
  ];

  /* ================= sandbox result ================= */
  function syncSbControls(){
    document.querySelectorAll(".seg2").forEach(function(seg){
      var key=seg.getAttribute("data-key");
      seg.querySelectorAll("button").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-v")===state.sb[key]?"true":"false"); });
    });
  }
  function renderSbResult(){
    var host=document.getElementById("sbres"); if(!host) return;
    var r=computeRisk(state.sb);
    var pct=r.score/100, len=(Math.PI*88*pct).toFixed(1);
    var col = r.decision==="allow" ? "var(--ok)" : r.decision==="step" ? "var(--mid)" : "var(--high)";
    var dlabel = r.decision==="allow" ? "ALLOW" : r.decision==="step" ? "STEP-UP" : "PAUSE";
    var contribs = r.parts.length
      ? r.parts.map(function(p){ return '<div class="contrib"><span>'+esc(p[0])+'</span><span class="cw">+'+p[1]+'</span></div>'; }).join("")
      : '<div class="contrib clean">No anomalies — every signal matches the customer’s pattern.</div>';
    host.innerHTML =
      '<div class="sb-r-top">'
      +'<div class="gauge" style="width:168px;flex:0 0 168px"><svg viewBox="0 0 200 118">'
      +'<path d="M12 108 A88 88 0 0 1 188 108" fill="none" stroke="var(--line-2)" stroke-width="12" stroke-linecap="round"/>'
      +'<path class="arc-fill" d="M12 108 A88 88 0 0 1 188 108" fill="none" stroke="'+col+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+len+' 999"/>'
      +'</svg><div class="gn" style="color:'+col+'">'+r.score+'</div><div class="go">/ 100</div></div>'
      +'<div><div class="decision '+r.decision+'">'+dlabel+'</div>'
      +'<div class="fine" style="margin-top:8px">SafeRemit Risk Score</div></div>'
      +'</div>'
      +'<div class="sb-contribs"><h5>Contributing signals</h5>'+contribs+'</div>'
      +'<div class="sb-explain"><span class="el">Gemini · reads the combination</span>'
      +'<p>“'+esc(explain(state.sb,r))+'”</p>'
      +'<div class="act">Provider action &nbsp;·&nbsp; <b>'+esc(providerAction(r.decision))+'</b></div></div>';
  }

  /* ================= engine ================= */
  function runPipeline(){
    var st=[].slice.call(document.querySelectorAll(".pstage"));
    var cn=[].slice.call(document.querySelectorAll(".pconn"));
    var sg=[].slice.call(document.querySelectorAll(".sig"));
    var sN=document.getElementById("scoreN"), sV=document.getElementById("scoreV");
    st.forEach(function(e){e.classList.remove("on");}); cn.forEach(function(e){e.classList.remove("on");}); sg.forEach(function(e){e.classList.remove("on");});
    if(sN) sN.textContent="0"; if(sV) sV.style.opacity="0";
    if(!MOTION){ st.concat(cn,sg).forEach(function(e){e.classList.add("on");}); if(sN) sN.textContent="91"; if(sV) sV.style.opacity="1"; return; }
    st.forEach(function(e,i){ setTimeout(function(){ e.classList.add("on"); if(cn[i-1]) cn[i-1].classList.add("on"); }, 210*i); });
    var scores=[12,50,72,84,88,91];
    sg.forEach(function(e,i){
      setTimeout(function(){
        e.classList.add("on");
        if(sN){ var from=i===0?0:scores[i-1], to=scores[i], t0=null;
          requestAnimationFrame(function tick(ts){ if(t0===null)t0=ts; var p=Math.min(1,(ts-t0)/380); sN.textContent=Math.round(from+(to-from)*p); if(p<1) requestAnimationFrame(tick); });
        }
        if(i===sg.length-1 && sV) setTimeout(function(){ sV.style.opacity="1"; },300);
      }, 860+360*i);
    });
  }
  function countUp(id,target,prefix){
    var el=document.getElementById(id); if(!el) return;
    if(!MOTION){ el.textContent=prefix+target.toLocaleString(); return; }
    var t0=null;
    requestAnimationFrame(function step(ts){ if(t0===null)t0=ts; var p=Math.min(1,(ts-t0)/900);
      el.textContent=prefix+Math.round(target*(1-Math.pow(1-p,3))).toLocaleString();
      if(p<1) requestAnimationFrame(step); });
  }

  function buildDots(){
    var host=document.getElementById("dots"); host.innerHTML="";
    SCENES.forEach(function(s,i){
      if(i>0){ var seg=document.createElement("span"); seg.className="seg"+(i<=state.i?" done":"")+(i===STORY_END+1?" gap":""); host.appendChild(seg); }
      var d=document.createElement("button");
      d.className="dot"; d.textContent=(i+1);
      d.setAttribute("data-on", i===state.i?"true":"false");
      d.setAttribute("data-done", i<state.i?"true":"false");
      d.title=s.label; d.setAttribute("aria-label","Step "+(i+1)+": "+s.label);
      d.addEventListener("click",function(){ goto(i); });
      host.appendChild(d);
    });
  }

  function render(){
    var sc=SCENES[state.i];
    stage.style.setProperty("--dir", state.dir>=0 ? "18px" : "-18px");
    stage.innerHTML='<div class="scene">'+sc.render()+'</div>';
    stage.querySelectorAll("[data-go]").forEach(function(b){ b.addEventListener("click",function(){ goto(parseInt(b.getAttribute("data-go"),10)); }); });
    if(sc.mount) sc.mount();

    if(state.lang==="ar"){
      stage.querySelectorAll("h1.disp, h2.disp, .lede, .q").forEach(function(el){ el.setAttribute("dir","rtl"); el.classList.add("ar"); });
      stage.querySelectorAll(".cta-row").forEach(function(el){ el.setAttribute("dir","rtl"); });
    }

    document.getElementById("pbar").style.width=((state.i+1)/SCENES.length*100).toFixed(1)+"%";
    var part = state.i<=STORY_END ? T("The story","القصة") : T("How it works","كيف يعمل");
    document.getElementById("scenelabel").innerHTML=part+' &nbsp;·&nbsp; <b>'+esc(sc.label)+'</b> &nbsp;·&nbsp; '+(state.i+1)+' / '+SCENES.length;
    var prev=document.getElementById("prev"), next=document.getElementById("next");
    prev.disabled = state.i===0;
    next.disabled = state.i===SCENES.length-1;
    next.textContent = state.i===STORY_END ? T("Try the sandbox","صندوق التجربة")+" →" : T("Next","التالي")+" →";
    buildDots();
    document.getElementById("foot").textContent = "SafeRemit · hackathon prototype · CAMARA + Nokia Network as Code + Gemini · this walkthrough is simulated · the live prototype at saferemit.onrender.com is not";
    window.scrollTo(MOTION ? {top:0,behavior:"smooth"} : 0, 0);
  }

  function goto(n){ if(n<0||n>=SCENES.length||n===state.i) return; state.dir = n>state.i ? 1 : -1; state.i=n; render(); }
  function goRel(d){ goto(state.i+d); }

  document.getElementById("prev").addEventListener("click",function(){ goRel(-1); });
  document.getElementById("next").addEventListener("click",function(){ goRel(1); });
  document.getElementById("restart").addEventListener("click",function(){ goto(0); });
  document.getElementById("langtog").addEventListener("click",function(){
    state.lang = state.lang==="en" ? "ar" : "en";
    this.innerHTML = state.lang==="en" ? '<b>EN</b> · ع' : 'EN · <b>ع</b>';
    render();
  });
  document.addEventListener("keydown",function(e){
    if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if(e.key==="ArrowRight") goRel(1);
    else if(e.key==="ArrowLeft") goRel(-1);
  });

  var lastY=0;
  window.addEventListener("scroll",function(){
    var y=window.scrollY||window.pageYOffset;
    if(y>90 && y>lastY+4) bar.classList.add("hide");
    else if(y<lastY-4 || y<90) bar.classList.remove("hide");
    lastY=y;
  },{passive:true});

  render();
})();
</script>
