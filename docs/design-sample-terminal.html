<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SafeRemit — Terminal Concept</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap');
  :root{
    --bg:#050806; --panel:#081109; --line:#123016;
    --green:#3dff88; --green-dim:#1f8a4c; --green-faint:#0f4a29;
    --amber:#ffb454; --red:#ff5b4d;
    --white:#d7ffe4;
    --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--green);
    font-family:var(--mono); font-size:14px; line-height:1.7;
  }
  .crt{
    position:relative; max-width:980px; margin:40px auto; padding:0 20px 80px;
  }
  /* scanline + glow overlay */
  .crt::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0px, rgba(0,0,0,0.14) 1px, transparent 1px, transparent 3px);
    mix-blend-mode:multiply; opacity:0.5;
  }
  .win{
    border:1px solid var(--green-faint); border-radius:10px;
    background: radial-gradient(1200px 600px at 50% -10%, rgba(61,255,136,0.05), transparent 60%), var(--panel);
    box-shadow: 0 0 0 1px rgba(61,255,136,0.06), 0 0 60px rgba(61,255,136,0.05) inset;
    overflow:hidden;
  }
  .win-bar{
    display:flex; align-items:center; gap:8px;
    padding:10px 14px; border-bottom:1px solid var(--green-faint);
    background:#050a06;
  }
  .win-dot{ width:10px; height:10px; border-radius:50%; background:var(--green-faint); }
  .win-title{
    margin-left:10px; font-size:11.5px; letter-spacing:.08em; color:var(--green-dim);
    text-transform:uppercase;
  }
  .win-body{ padding:26px 26px 10px; }

  .prompt{ color:var(--green-dim); }
  .out{ color:var(--green); }
  .out.dim{ color:var(--green-dim); }
  .out.white{ color:var(--white); }
  .out.amber{ color:var(--amber); }
  .out.red{ color:var(--red); }
  .ln{ white-space:pre-wrap; margin:0 0 4px; opacity:0; }
  .ln.show{ opacity:1; }
  .gap{ height:14px; }

  .cursor{
    display:inline-block; width:8px; height:15px; background:var(--green);
    vertical-align:-2px; animation:blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  h1.big{
    font-family:var(--mono); font-weight:700; font-size:clamp(1.5rem,4.2vw,2.5rem);
    color:var(--white); line-height:1.25; margin:10px 0 0; letter-spacing:-0.01em;
  }
  h1.big .hl{ color:var(--red); }

  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:18px 0 6px; }
  .stat-box{ border:1px solid var(--green-faint); border-radius:6px; padding:14px 16px; }
  .stat-box .n{ font-size:1.5rem; color:var(--white); font-weight:700; }
  .stat-box .l{ font-size:11px; color:var(--green-dim); margin-top:6px; line-height:1.5; }

  .trace-box{ border:1px solid var(--green-faint); border-radius:8px; padding:16px 18px; margin:14px 0; }
  .trace-row{ display:flex; justify-content:space-between; gap:14px; padding:4px 0; }
  .trace-row .k{ color:var(--green-dim); }
  .trace-row .v{ color:var(--white); }
  .verdict{
    margin-top:16px; text-align:center; padding:18px; border:2px solid var(--red);
    border-radius:8px; color:var(--red); font-weight:700; font-size:1.3rem;
    letter-spacing:.14em; background:rgba(255,91,77,0.06);
    text-shadow:0 0 18px rgba(255,91,77,0.5);
  }
  .verdict .sub{ display:block; margin-top:6px; font-size:11px; letter-spacing:.06em; color:var(--red); opacity:0.8; font-weight:400; }
</style>
</head>
<body>
<div class="crt">
  <div class="win">
    <div class="win-bar">
      <span class="win-dot"></span><span class="win-dot"></span><span class="win-dot"></span>
      <span class="win-title">root@saferemit — fraud-agent — live</span>
    </div>
    <div class="win-body" id="feed"></div>
  </div>
</div>

<script>
const lines = [
  { t: 'prompt', text: '$ tail -f /var/log/saferemit/network-signals.log' },
  { t: 'gap' },
  { t: 'dim', text: '[boot] connecting to CAMARA / Nokia Network-as-Code ... OK' },
  { t: 'dim', text: '[boot] connecting to Google AI Studio (Gemini) ... OK' },
  { t: 'dim', text: '[boot] LangGraph agent compiled: initial_checks -> escalated_checks -> ai_assessment -> finalize' },
  { t: 'gap' },
  { t: 'amber', text: '[context] $22.7B remitted to Egypt alone in 2024 -- World Bank' },
  { t: 'amber', text: '[context] ~$3,000 lost per SIM-swap victim, MENA/Türkiye -- Kaspersky' },
  { t: 'amber', text: '[context] 40,000+ UAE residents scammed in 2024 -- BioCatch' },
  { t: 'gap' },
  { t: 'h1' },
  { t: 'gap' },
  { t: 'white', text: 'A password or an OTP cannot tell the real customer from the' },
  { t: 'white', text: 'attacker holding their number. The network can.' },
  { t: 'stats' },
  { t: 'gap' },
  { t: 'dim', text: '$ curl -X POST /api/decide -d \'{"phone":"+99999991000","action":"transfer"}\'' },
  { t: 'gap' },
  { t: 'trace' },
];

const feed = document.getElementById('feed');
let i = 0;

function typeLine(el, text, speed, cb) {
  el.classList.add('show');
  let j = 0;
  const iv = setInterval(() => {
    el.textContent = text.slice(0, j) + (j < text.length ? '▌' : '');
    j++;
    if (j > text.length) { clearInterval(iv); el.textContent = text; cb && cb(); }
  }, speed);
}

function next() {
  if (i >= lines.length) return;
  const spec = lines[i++];

  if (spec.t === 'gap') { const g = document.createElement('div'); g.className = 'gap'; feed.appendChild(g); next(); return; }

  if (spec.t === 'h1') {
    const h = document.createElement('h1');
    h.className = 'big ln';
    h.innerHTML = 'Fraud follows the money families send home from the <span class="hl">Middle East and Türkiye</span>.';
    feed.appendChild(h);
    requestAnimationFrame(() => h.classList.add('show'));
    setTimeout(next, 500);
    return;
  }

  if (spec.t === 'stats') {
    const grid = document.createElement('div');
    grid.className = 'stat-grid ln';
    grid.innerHTML = `
      <div class="stat-box"><div class="n">$22.7B</div><div class="l">received by Egypt alone, 2024</div></div>
      <div class="stat-box"><div class="n">~$3,000</div><div class="l">typical SIM-swap victim loss</div></div>
      <div class="stat-box"><div class="n">40,000+</div><div class="l">UAE residents scammed, 2024</div></div>`;
    feed.appendChild(grid);
    requestAnimationFrame(() => grid.classList.add('show'));
    setTimeout(next, 300);
    return;
  }

  if (spec.t === 'trace') {
    const box = document.createElement('div');
    box.className = 'trace-box ln';
    box.innerHTML = `
      <div class="trace-row"><span class="k">sim_swap</span><span class="v" style="color:var(--red)">SWAPPED &lt;72h  +45</span></div>
      <div class="trace-row"><span class="k">device_status</span><span class="v" style="color:var(--red)">UNKNOWN, ROAMING  +30</span></div>
      <div class="trace-row"><span class="k">location_verification</span><span class="v" style="color:var(--red)">MISMATCH 0%  +30</span></div>
      <div class="trace-row"><span class="k">ai_analyst (gemini)</span><span class="v">BLOCK · risk 92</span></div>
      <div class="verdict">██ BLOCK ██<span class="sub">rules 100 · gemini 92 · both engines agree</span></div>`;
    feed.appendChild(box);
    requestAnimationFrame(() => box.classList.add('show'));
    setTimeout(next, 300);
    return;
  }

  const el = document.createElement('p');
  el.className = `ln out ${spec.t}`;
  feed.appendChild(el);
  typeLine(el, spec.text, spec.text.length > 60 ? 6 : 12, () => setTimeout(next, spec.t === 'prompt' ? 200 : 90));
}
next();
</script>
</body>
</html>
